<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; font-src 'none'; connect-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L’accélérateur linéaire</title>
<style>
/* ---------- UI chrome tokens (the scene and graphs stay on white "paper") ---------- */
:root{
  --bg:#f4f6f8; --panel:#ffffff; --ink:#1f2933; --muted:#5f6b7a; --line:#d9dee5;
  --accent:#2563a8; --accent-ink:#ffffff; --chip:#eef2f7; --danger:#b42318;
  --paper:#ffffff;
  --font: "Inter", "Segoe UI", system-ui, -apple-system, "Noto Sans", "Noto Sans Arabic", "Geeza Pro", sans-serif;
  --math: "Cambria Math", "STIX Two Math", "Times New Roman", serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14181d; --panel:#1c222a; --ink:#e6e9ee; --muted:#9aa5b1; --line:#2f3843;
    --accent:#6aa5e0; --accent-ink:#0d1520; --chip:#26303b; --danger:#f97066;
  }
}
:root[data-theme="dark"]{
  --bg:#14181d; --panel:#1c222a; --ink:#e6e9ee; --muted:#9aa5b1; --line:#2f3843;
  --accent:#6aa5e0; --accent-ink:#0d1520; --chip:#26303b; --danger:#f97066;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;flex-wrap:wrap}
header h1{font-size:1.15rem;margin:0;font-weight:650}
header p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.langs{display:flex;gap:4px}
.langs button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:5px 10px;cursor:pointer;font:inherit;font-size:.85rem}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;padding:0 20px 20px;max-width:1400px;margin:0 auto}
.left{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.stage{padding:10px;position:relative}
.stage canvas{display:block;width:100%;aspect-ratio:16/10;background:var(--paper);border-radius:8px}
.transport{display:flex;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap;direction:ltr}
.transport button{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:8px;min-width:40px;height:36px;padding:0 10px;cursor:pointer;font:inherit}
.transport button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);min-width:96px;font-weight:600}
.transport input[type=range]{flex:1;min-width:120px}
.transport .clock{font-variant-numeric:tabular-nums;min-width:96px;text-align:end;color:var(--muted)}
.transport select{height:36px;border-radius:8px;border:1px solid var(--line);background:var(--chip);color:var(--ink);font:inherit;padding:0 6px}
aside{padding:14px;display:flex;flex-direction:column;gap:16px;align-self:start}
aside h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px}
html[dir=rtl] aside h2{letter-spacing:0;text-transform:none;font-size:.9rem}
.param{margin-bottom:10px}
.param label{display:flex;justify-content:space-between;gap:8px;font-size:.92rem}
.param output{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:600;direction:ltr;unicode-bidi:isolate}
.param input{width:100%}
.toggles label{display:flex;align-items:center;gap:8px;font-size:.92rem;margin:4px 0;cursor:pointer}
table.readouts{width:100%;border-collapse:collapse;font-size:.92rem}
table.readouts td{padding:3px 0;border-bottom:1px solid var(--line)}
table.readouts td:last-child{text-align:end;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tools button{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit;font-size:.85rem}
.graphs{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.graph{padding:10px}
.graph h3{margin:2px 4px 8px;font-size:.95rem;font-weight:600}
.graph canvas{display:block;width:100%;aspect-ratio:16/9;background:var(--paper);border-radius:8px}
.model{grid-column:1/-1;padding:14px 18px;font-size:.92rem;line-height:1.9}
.model h2{font-size:1rem;margin:0 0 8px}
.model .eq{direction:ltr;unicode-bidi:isolate;text-align:center;font-family:var(--math);font-size:1.12rem;margin:8px 0}
.model ul{margin:6px 0;padding-inline-start:20px}
.model .meta{color:var(--muted);font-size:.85rem;margin-top:8px}
.m{font-family:var(--math);direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.m i{font-style:italic}
.vec{position:relative;display:inline-block}
.vec::before{content:"\2192";position:absolute;left:0;right:0;top:-.6em;font-size:.72em;text-align:center;font-style:normal;line-height:1}
.err{display:none;background:#fdecea;color:var(--danger);border:1px solid #f5c2bd;border-radius:8px;padding:8px 10px;margin-top:8px;font-size:.88rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:860px){ main{grid-template-columns:1fr;padding:0 16px 16px} header{padding:12px 16px} .graphs{grid-template-columns:1fr} }
</style>
</head>
<body>
<header>
  <div><h1 id="title"></h1><p id="subtitle"></p></div>
  <div class="langs" role="group" aria-label="Language">
    <a href="index.html" style="border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:8px;padding:5px 10px;font-size:.85rem;text-decoration:none;margin-inline-end:6px" title="Retour à l’accueil du chapitre">⌂ Chapitre 12</a>
    <button data-lang="fr">FR</button><button data-lang="en">EN</button><button data-lang="ar">ع</button>
  </div>
</header>
<main>
  <div class="left">
  <section class="card stage">
    <canvas id="scene" aria-label="simulation"></canvas>
    <div class="transport">
      <button id="btnBack" title="←">&#9664;&#9664;</button>
      <button id="btnPlay" class="primary"></button>
      <button id="btnStep" title="→">&#9654;&#9654;</button>
      <button id="btnReset" title="R">&#8634;</button>
      <input id="timeline" type="range" min="0" max="1" step="any" value="0" aria-label="t">
      <span class="clock m" id="clock"></span>
      <select id="speed" aria-label="speed">
        <option value="0.1">×0,1</option><option value="0.25">×0,25</option><option value="0.5">×0,5</option>
        <option value="1" selected>×1</option><option value="2">×2</option><option value="4">×4</option>
      </select>
    </div>
    <div class="err" id="err" role="alert"></div>
  </section>
  <section class="graphs" id="graphs"></section>
  </div>
  <aside class="card">
    <div><h2 data-i18n="params"></h2><div id="params"></div></div>
    <div class="toggles"><h2 data-i18n="display"></h2><div id="toggles"></div></div>
    <div><h2 data-i18n="readouts"></h2><table class="readouts" id="readouts"></table></div>
    <div class="tools">
      <button id="btnPin" data-i18n="pin"></button>
      <button id="btnClearPins" data-i18n="clearPins"></button>
      <button id="btnCsv" data-i18n="csv"></button>
      <button id="btnPng" data-i18n="png"></button>
    </div>
  </aside>
  <section class="card model" id="modelInfo"></section>
</main>

<script>
/* =====================================================================
   CORE — numerical integration. Pure JS, no DOM. Do not edit per model;
   scripts/validate_model.mjs extracts and tests this exact block.
   ===================================================================== */
/*CORE-BEGIN*/
const Core = (() => {
  function rk4(f, t, y, h, p) {
    const n = y.length, k1 = f(t, y, p), y2 = new Array(n), y3 = new Array(n), y4 = new Array(n), out = new Array(n);
    for (let i = 0; i < n; i++) y2[i] = y[i] + 0.5 * h * k1[i];
    const k2 = f(t + 0.5 * h, y2, p);
    for (let i = 0; i < n; i++) y3[i] = y[i] + 0.5 * h * k2[i];
    const k3 = f(t + 0.5 * h, y3, p);
    for (let i = 0; i < n; i++) y4[i] = y[i] + h * k3[i];
    const k4 = f(t + h, y4, p);
    for (let i = 0; i < n; i++) out[i] = y[i] + (h / 6) * (k1[i] + 2 * k2[i] + 2 * k3[i] + k4[i]);
    return out;
  }
  // Velocity-Verlet (symplectic). State layout: [q_1..q_m, v_1..v_m]; derivs must return
  // accelerations in the second half that depend on positions (and t) only.
  function verlet(f, t, y, h, p) {
    const m = y.length / 2, a0 = f(t, y, p).slice(m), out = new Array(y.length);
    for (let i = 0; i < m; i++) out[i] = y[i] + h * y[m + i] + 0.5 * h * h * a0[i];
    for (let i = 0; i < m; i++) out[m + i] = y[m + i];
    const a1 = f(t + h, out, p).slice(m);
    for (let i = 0; i < m; i++) out[m + i] = y[m + i] + 0.5 * h * (a0[i] + a1[i]);
    return out;
  }
  const val = (v, p, run) => (typeof v === 'function' ? v(p, run) : v);

  function simulate(model, p, opts = {}) {
    const dt = opts.dt ?? val(model.dt, p);
    const tEnd = val(model.tEnd, p);
    const step = model.integrator === 'verlet' ? verlet : rk4;
    const f = model.derivs, evs = model.events || [];
    if (!(dt > 0) || !(tEnd > 0)) throw new Error('dt and tEnd must be positive');
    if (tEnd / dt > 2e6) throw new Error('Too many steps (tEnd/dt > 2e6): increase dt or shorten tEnd');
    let t = 0, y = model.init(p).slice();
    const T = [t], Y = [y.slice()], events = [];
    let gPrev = evs.map(e => e.g(t, y, p)), stopped = false;
    while (t < tEnd - 1e-12 * tEnd && !stopped) {
      const h = Math.min(dt, tEnd - t);
      let yn = step(f, t, y, h, p), tn = t + h;
      for (let k = 0; k < evs.length; k++) {
        const e = evs[k], dir = e.direction ?? 0, g0 = gPrev[k], g1 = e.g(tn, yn, p);
        const crossed = (dir <= 0 && g0 >= 0 && g1 < 0) || (dir >= 0 && g0 <= 0 && g1 > 0 && !(g0 === 0 && dir === 0));
        if (!crossed || (t === 0 && g0 === 0)) continue;     // starting exactly on the surface is not a crossing
        let lo = 0, hi = h;                              // bisection on the step length
        for (let it = 0; it < 60; it++) {
          const mid = 0.5 * (lo + hi), gm = e.g(t + mid, step(f, t, y, mid, p), p);
          if ((gm < 0) === (g1 < 0)) hi = mid; else lo = mid;
        }
        const yr = step(f, t, y, hi, p), tr = t + hi;
        events.push({ name: e.name, t: tr, y: yr.slice() });
        const term = typeof e.terminal === 'function' ? e.terminal(tr, yr, p) : e.terminal;
        if (term || e.apply) {                           // the run changes here: stop at the event, or restart from it
          tn = tr; yn = e.apply ? e.apply(tr, yr, p).slice() : yr;
          if (term) stopped = true;
          break;                                         // at most one state-changing event per step
        }                                                // a marker event (no apply, not terminal) leaves the grid untouched
      }
      for (let i = 0; i < yn.length; i++) if (!Number.isFinite(yn[i])) throw new Error('Non-finite state at t = ' + tn);
      t = tn; y = yn; T.push(t); Y.push(y.slice());
      gPrev = evs.map(e => e.g(t, y, p));
    }
    return { T, Y, events, dt, tEnd: t };
  }
  function locate(T, t) {                                // index i with T[i] <= t < T[i+1]
    let lo = 0, hi = T.length - 1;
    if (t <= T[0]) return 0; if (t >= T[hi]) return hi;
    while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (T[mid] <= t) lo = mid; else hi = mid; }
    return lo;
  }
  return { rk4, verlet, simulate, locate, val };
})();
/*CORE-END*/

/* =====================================================================
   MODEL — the only block to rewrite for a new animation.
   Pure physics in derivs/init/observe/analytic/events (no DOM: the
   validator runs them in Node). draw() uses the H helper library.
   ===================================================================== */
/*MODEL-BEGIN*/
const MODEL = {
  id: 'accelerateur_lineaire',
  title: { fr: 'L’accélérateur linéaire', en: 'The linear accelerator', ar: 'المسرِّع الخطي' },
  subtitle: { fr: 'Terminale spécialité — Chapitre 12, § 2.f · un proton gagne eU à chaque intervalle', en: 'Year 13 (Terminale) — Chapter 12, § 2.f · a proton gains eU in each gap', ar: 'الصف الثالث الثانوي — الفصل 12، § 2.f · يكتسب البروتون eU في كل فجوة' },
  level: 'Terminale',
  defaultLang: 'fr',

  params: [
    { key: 'N', sym: 'n', unit: '', min: 1, max: 10, step: 1, value: 10,
      label: { fr: 'Nombre d’intervalles accélérateurs', en: 'Number of accelerating gaps', ar: 'عدد فجوات التسريع' } },
    { key: 'U', sym: 'U', unit: 'kV', min: 10, max: 100, step: 5, value: 50,
      label: { fr: 'Tension d’un intervalle', en: 'Voltage across one gap', ar: 'التوتر بين طرفي فجوة' } },
  ],

  // State [x, v, k]: k counts the boundaries already crossed (gap → tube → gap …), stored in the state so that
  // each boundary event fires once. In a gap (k even, k ≤ 2N−2): uniform field E = U/w, a = eU/(m w). In a tube: a = 0.
  // Tube j (after gap j) has length v_j·τ so that the proton spends τ = 10 ns in it (time for the voltage to reverse).
  _geo: p => {
    const e = 1.602176634e-19, m = 1.67262192e-27, w = 0.01, tau = 1e-8, N = Math.round(p.N), B = [];
    let x = 0;
    for (let j = 1; j <= N; j++) { x += w; B.push(x); if (j < N) { x += Math.sqrt(2 * j * e * p.U * 1e3 / m) * tau; B.push(x); } }
    const xEnd = x + 0.1; B.push(xEnd);
    return { e, m, w, tau, N, B, xEnd, a: e * p.U * 1e3 / (m * w) };
  },
  init: p => [0, 0, 0],
  derivs: (t, s, p) => { const G = MODEL._geo(p), k = Math.round(s[2]); return [s[1], (k % 2 === 0 && k <= 2 * G.N - 2) ? G.a : 0, 0]; },
  integrator: 'rk4',
  dt: 2e-11,
  tEnd: p => { const G = MODEL._geo(p); let t = 0, v = 0;
    for (let j = 1; j <= G.N; j++) { const v2 = Math.sqrt(2 * j * G.e * p.U * 1e3 / G.m); t += 2 * G.w / (v + v2) + (j < G.N ? G.tau : 0.1 / v2); v = v2; }
    return 1.02 * t; },
  events: [
    { name: 'frontière', g: (t, s, p) => { const G = MODEL._geo(p), k = Math.round(s[2]); return k < G.B.length - 1 ? s[0] - G.B[k] : -1; }, direction: 1,
      apply: (t, s) => [s[0], s[1], Math.round(s[2]) + 1] },
    { name: 'fin', g: (t, s, p) => s[0] - MODEL._geo(p).xEnd, direction: 1, terminal: true },
  ],
  timeScale: p => MODEL.tEnd(p) / 7,                     // whole run ≈ 7 s on screen
  stepDt: 5e-9,

  quantities: {
    t:  { sym: 't', unit: 'ns', label: { fr: 'Temps', en: 'Time', ar: 'الزمن' } },
    x:  { sym: 'x', unit: 'm', label: { fr: 'Position du proton', en: 'Position of the proton', ar: 'موضع البروتون' } },
    y:  { sym: 'y', unit: 'm', label: { fr: 'Ordonnée', en: 'y-coordinate', ar: 'الترتيبة' } },
    n:  { sym: 'n', unit: '', label: { fr: 'Intervalles franchis', en: 'Gaps crossed', ar: 'الفجوات المجتازة' }, sig: 2 },
    v:  { sym: 'v', unit: '10⁶ m·s⁻¹', label: { fr: 'Vitesse du proton', en: 'Speed of the proton', ar: 'سرعة البروتون' }, color: 'v' },
    Ec: { sym: 'E_c', unit: 'keV', label: { fr: 'Énergie cinétique', en: 'Kinetic energy', ar: 'الطاقة الحركية' }, color: 'E1', sig: 4 },
  },
  observe: (t, s, p) => { const k = Math.round(s[2]); return { t: t * 1e9, x: s[0], y: 0, n: Math.min(Math.floor((k + 1) / 2), Math.round(p.N)), v: s[1] / 1e6, Ec: 0.5 * 1.67262192e-27 * s[1] * s[1] / 1.602176634e-19 / 1e3 }; },
  analytic: () => null,
  invariants: [],

  readouts: ['t', 'n', 'x', 'v', 'Ec'],
  graphs: [
    { title: { fr: 'Énergie cinétique : une marche de eU par intervalle', en: 'Kinetic energy: one step of eU per gap', ar: 'الطاقة الحركية: درجة قدرها eU في كل فجوة' }, x: 't', series: ['Ec'], yMin: 0 },
    { title: { fr: 'Vitesse : constante dans les tubes', en: 'Speed: constant inside the tubes', ar: 'السرعة: ثابتة داخل الأنابيب' }, x: 't', series: ['v'], yMin: 0 },
  ],
  toggles: { vectors: true, trail: false, chrono: true, theory: false, full: false },
  hideToggles: ['trail', 'theory'],

  view: { keys: ['x', 'y'], includeOrigin: true, pad: 0.04, minSpan: 0.25, anchor: 'center' },
  draw: (H, S) => {
    const p = S.p, o = S.o, G = MODEL._geo(p), k = Math.round(S.y[2]), L = S.lang, ar = L === 'ar', hw = 0.03;
    const yc = (H.Y(0) - H.H / 2) / H.scale, Yc = y => yc + y;   // draw around the vertical centre of the view
    // source, drift tubes (between gap j and gap j+1), exit region
    H.poly([[-0.025, Yc(-hw)], [-0.004, Yc(-hw)], [-0.004, Yc(hw)], [-0.025, Yc(hw)]], { fill: '#d6dbe2', stroke: '#8a94a3', width: 1 });
    H.text({ fr: 'source', en: 'source', ar: 'المنبع' }, -0.014, Yc(-hw - 0.014), { size: 11, color: '#6b7684', align: 'center' });
    for (let j = 0; j + 1 < G.N; j++) { const a = G.B[2 * j], b = G.B[2 * j + 1];
      H.poly([[a + 0.002, Yc(-hw)], [b - 0.002, Yc(-hw)], [b - 0.002, Yc(hw)], [a + 0.002, Yc(hw)]], { fill: '#b7c9de', stroke: '#2563a8', width: 1 });
      H.text(`${j + 1}`, (a + b) / 2, Yc(-hw - 0.014), { size: 11, color: '#2563a8', align: 'center' }); }
    // gaps: field arrow in the gap being crossed
    for (let j = 0; j < G.N; j++) { const g0 = j === 0 ? 0 : G.B[2 * j - 1], inGap = k === 2 * j;
      H.line(g0, Yc(-hw), g0, Yc(hw), { color: '#cfd6de', width: 1 }); H.line(g0 + G.w, Yc(-hw), g0 + G.w, Yc(hw), { color: '#cfd6de', width: 1 });
      if (inGap) H.vector(g0 + 0.001, Yc(hw + 0.012), G.w - 0.002, 0, { color: '#7b5ea7', width: 2, label: '\\vec{E}' }); }
    if (S.show.chrono) H.chrono(S.chrono('x', 'y').map(([x]) => [x, Yc(0)]), { label: false });
    H.ball(o.x, Yc(0), 6, '#c0392b');
    if (S.show.vectors) { const sv = H.autoScale('v', 0.08); H.vector(o.x, Yc(0), o.v * sv, 0, { color: 'v', label: '\\vec{v}' }); }
    const X0 = ar ? H.W - 14 * H.dpr : 14 * H.dpr, al = ar ? 'right' : 'left';
    H.text({ fr: 'Croix : position toutes les 5 ns · tubes de plus en plus longs', en: 'Crosses: position every 5 ns · tubes longer and longer', ar: 'الصلبان: الموضع كل 5 ns · أنابيب تزداد طولاً' }, X0, 16 * H.dpr, { world: false, size: 13, color: '#1f2933', align: al });
  },

  info: {
    equations: {
      fr: 'Système : un proton, référentiel du laboratoire supposé galiléen, poids négligé.<br>Dans un intervalle de largeur <i>w</i> : champ uniforme <i>E</i> = <i>U</i>/<i>w</i>, <span class="m">m<span class="vec"><i>a</i></span> = e<span class="vec"><i>E</i></span></span> ; travail de la force électrique <i>W</i> = <i>eU</i>. Dans un tube : champ nul, mouvement rectiligne uniforme.<br>Théorème de l’énergie cinétique : après <i>n</i> intervalles, <i>E<sub>c</sub></i> = <i>n eU</i> et <i>v<sub>n</sub></i> = √(2<i>n eU</i>/<i>m</i>).<br>Le tube <i>n</i> a pour longueur <i>v<sub>n</sub></i>·τ, avec τ = 10 ns : le temps passé dans chaque tube est le même.',
      en: 'System: a proton, lab frame assumed inertial, weight neglected.<br>In a gap of width <i>w</i>: uniform field <i>E</i> = <i>U</i>/<i>w</i>, <span class="m">m<span class="vec"><i>a</i></span> = e<span class="vec"><i>E</i></span></span>; work of the electric force <i>W</i> = <i>eU</i>. Inside a tube: no field, uniform straight-line motion.<br>Work–energy theorem: after <i>n</i> gaps, <i>E<sub>c</sub></i> = <i>n eU</i> and <i>v<sub>n</sub></i> = √(2<i>n eU</i>/<i>m</i>).<br>Tube <i>n</i> is <i>v<sub>n</sub></i>·τ long, with τ = 10 ns: the time spent in every tube is the same.',

  const rows = [keys.map(k => `${Q[k].sym.replace(/[\\{}]/g, '')} (${Q[k].unit})`).join(sep)];
  for (let k = 0; k * st <= RUN.tEnd + 1e-9; k++) { const i = Core.locate(RUN.T, k * st); rows.push(keys.map(q => Number(OBS[q][i].toPrecision(6)).toString().replace('.', dec)).join(sep)); }
  download(new Blob(['﻿' + rows.join('\r\n')], { type: 'text/csv' }), `${MODEL.id || 'simulation'}.csv`);
};
$('btnPng').onclick = () => scene.toBlob(b => b && download(b, `${MODEL.id || 'simulation'}.png`));
function download(blob, name) { try { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); } catch (e) { console.warn(e); } }
$('speed').addEventListener('change', () => last = performance.now());
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type !== 'checkbox') return;
  if (e.code === 'Space') { e.preventDefault(); $('btnPlay').click(); }
  else if (e.key === 'ArrowRight') $('btnStep').click(); else if (e.key === 'ArrowLeft') $('btnBack').click();
  else if (e.key === 'r' || e.key === 'R') $('btnReset').click();
});

/* ---------- loop ---------- */
let last = performance.now(), lastClock = '';
function frame(now) {
  const dtReal = Math.min(0.1, (now - last) / 1000); last = now;
  if (playing && RUN) {
    tPlay += dtReal * parseFloat($('speed').value) * (Core.val(MODEL.timeScale, P) || 1);
    if (tPlay >= RUN.tEnd) { tPlay = RUN.tEnd; setPlay(false); } dirty = true;
  }
  if (dirty && RUN) {
    dirty = false; const cur = current();
    drawScene(); graphs.forEach(g => drawGraph(g, cur)); updateReadouts(cur);
    $('timeline').value = tPlay;
    const clk = `t = ${fmt(cur.o.t, 3, true)} ${Q.t.unit}`; if (clk !== lastClock) { $('clock').textContent = clk; lastClock = clk; }
  }
  requestAnimationFrame(frame);
}
new ResizeObserver(() => dirty = true).observe(document.body);
rebuild(); applyLang();
if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) setPlay(false);
requestAnimationFrame(frame);
window.__SIM__ = { P, get RUN() { return RUN; }, seek, rebuild, setLang: l => { LANG = l; applyLang(); }, play: () => setPlay(true) };
})();
</script>
